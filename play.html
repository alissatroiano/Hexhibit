<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hexhibit</title>
<link rel="icon" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/gallery.css">
</head>

<body>
<div class="vig"></div>
<div class="banner" id="banner" role="status" hidden></div>
<p class="sr-only" id="mode-status" role="status" aria-live="polite"></p>
<div class="fatal" id="fatal" role="alert" hidden></div>
<header class="top">
  <a class="brand" href="./" aria-label="Hexhibit home">
    <img class="mark" src="assets/images/favicon.png" alt="">
    <img class="wordmark" src="assets/images/hexhibit-logo.png" alt="Hexhibit">
  </a>
  <div class="status"><span id="prog"></span><div class="slots" id="slots" aria-label="Door code"></div></div>
</header>
<section id="daylight-gallery" aria-label="Daylight gallery">
  <div id="gallery-scene-mount"></div>
  <button class="btn escape-cta" id="escape-cta" type="button">Enter escape room &rarr;</button>
</section>
<div id="stage" hidden inert>
<div class="viewport"><div class="world" id="world">
  <div class="floor"></div><div class="ceiling"></div><div class="wall wall-left"></div><div class="wall wall-right"></div>
  <div class="wall wall-back"><div class="door-frame"><div class="door-void">THE NIGHT AIR</div>
    <div class="door" id="door"><div class="door-panel"></div><div class="door-panel"></div><span class="lock" id="lock">LOCKED</span></div></div></div>
</div></div>
</div>
<div class="bar">
  <button class="btn ghost" id="prev" aria-label="Previous stop">Back</button>
  <span class="pill hint">W/S or scroll to walk · Use your finger or mouse to look around · Click a painting when you're beside it</span>
  <button class="btn" id="next" aria-label="Next stop">Next</button>
</div>
<div class="modal" id="modal" aria-hidden="true"><div class="card" role="dialog" aria-modal="true" aria-labelledby="mt">
  <button class="x" id="close" aria-label="Close">&times;</button>
  <div id="mdyn"></div>
  <p class="fb" id="fb" role="status"></p>
</div></div>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
